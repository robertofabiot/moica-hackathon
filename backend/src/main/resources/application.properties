spring.application.name=moica-backend

# El puerto y la conexion salen del entorno. Si las variables no estan definidas
# en el sistema, se importan del archivo `.env` de la raiz del repositorio, que
# no se versiona. Las variables de entorno reales tienen prioridad sobre el
# archivo, de modo que CI y produccion no dependen de el.
spring.config.import=optional:file:../.env[.properties]

server.port=${MOICA_BACKEND_PORT:8080}

# -----------------------------------------------------------------------------
# Base de datos
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${MOICA_DB_HOST:localhost}:${MOICA_DB_PORT:5432}/${MOICA_DB_NOMBRE}
spring.datasource.username=${MOICA_DB_USUARIO}
spring.datasource.password=${MOICA_DB_CLAVE}

# El esquema lo crean las migraciones versionadas, nunca Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway aplica al arrancar las migraciones de db/migration y registra cada una
# en `flyway_schema_history`. Es el unico mecanismo autorizado para cambiar el
# esquema, en local, en CI y en produccion.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# Autenticacion y sesiones
# -----------------------------------------------------------------------------
# Secreto con el que se firma el JWT de sesion. No tiene valor por omision a
# proposito: la aplicacion no debe arrancar con una clave conocida. Se define en
# el entorno. `.env.example` incluye un valor publico solo para desarrollo local;
# ese valor no debe usarse en un entorno compartido ni productivo.
moica.seguridad.secreto-jwt=${MOICA_JWT_SECRETO}

# Duracion de una sesion (formato ISO-8601). Decision D-SEC-01: siete dias, sin
# renovacion automatica ni refresh token. Al expirar se vuelve a iniciar sesion.
moica.seguridad.duracion-de-sesion=${MOICA_SESION_DURACION:P7D}

# `Secure` en la cookie de sesion y en la de CSRF. En produccion siempre `true`;
# en desarrollo `false`, porque el proxy de Vite trabaja sobre HTTP.
moica.seguridad.cookie-segura=${MOICA_COOKIE_SEGURA:false}

# -----------------------------------------------------------------------------
# Segundo factor (TOTP)
# -----------------------------------------------------------------------------
# Clave con la que se cifra el secreto TOTP antes de guardarlo (AES-GCM). En
# Base64 y de 16, 24 o 32 bytes. No tiene valor por omision a proposito: sin
# ella la aplicacion no arranca, porque un secreto TOTP sin cifrar equivale a
# entregar el segundo factor de todas las cuentas. `.env.example` incluye un
# valor publico solo para desarrollo local.
moica.segundo-factor.clave-de-cifrado=${MOICA_TOTP_CLAVE_CIFRADO}

# Parametros de los codigos, en un solo lugar. Son los que espera cualquier
# aplicacion autenticadora y los que anuncia la URI `otpauth://`. Cambiar
# cualquiera de ellos invalidaria los secretos ya registrados, asi que no se
# exponen por variable de entorno.
moica.segundo-factor.digitos=6
moica.segundo-factor.periodo=30s
# Periodos aceptados hacia atras y hacia delante ademas del actual. Uno absorbe
# el desfase habitual entre el reloj del telefono y el del servidor sin alargar
# de mas la vida util del codigo.
moica.segundo-factor.pasos-de-tolerancia=1

# -----------------------------------------------------------------------------
# Almacenamiento de imagenes publicas (Cloudflare R2)
# -----------------------------------------------------------------------------
# Conexion con el bucket publico de imagenes mediante la compatibilidad S3 de
# R2. Sin valores por omision a proposito: sin las cinco variables la
# aplicacion arranca igualmente, pero subir o borrar imagenes responde un error
# uniforme de almacenamiento no disponible. Una configuracion a medias detiene
# el arranque, porque solo puede ser un error de despliegue.
moica.almacenamiento.id-cuenta=${MOICA_R2_ID_CUENTA:}
moica.almacenamiento.access-key-id=${MOICA_R2_ACCESS_KEY_ID:}
moica.almacenamiento.secret-access-key=${MOICA_R2_SECRET_ACCESS_KEY:}
moica.almacenamiento.bucket-publico=${MOICA_R2_BUCKET_PUBLICO:}
moica.almacenamiento.url-publica-base=${MOICA_R2_URL_PUBLICA_BASE:}

# Maximo por imagen que aceptan el perfil y el portafolio. Se valida en el
# backend junto con el formato y la firma real del archivo.
moica.imagenes.tamano-maximo=${MOICA_IMAGEN_TAMANO_MAXIMO:5MB}

# Tope de transporte de las peticiones multipart, deliberadamente por encima
# del maximo de negocio: asi el rechazo por tamano lo produce la validacion de
# la aplicacion, con su codigo y su mensaje, y el contenedor solo corta abusos
# muy por encima de lo razonable.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# -----------------------------------------------------------------------------
# Rol administrativo
# -----------------------------------------------------------------------------
# Correo de la cuenta ordinaria que recibe el rol administrativo al arrancar.
# Vacio por omision: sin esta variable Moica no promueve a nadie. No existe
# registro publico de administradores ni endpoint de promocion.
moica.administracion.correo=${MOICA_ADMIN_CORREO:}

# -----------------------------------------------------------------------------
# Healthcheck
# -----------------------------------------------------------------------------
# Se expone unicamente `/actuator/health`. El resto de endpoints de Actuator
# permanece cerrado: publicarlos revelaria configuracion y entorno.
management.endpoints.web.exposure.include=health
# La respuesta publica es solo el estado agregado. El detalle por componente
# (por ejemplo, la conexion a la base de datos) influye en ese estado, pero no
# se devuelve: describiria la infraestructura a cualquiera que consulte.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# -----------------------------------------------------------------------------
# Errores
# -----------------------------------------------------------------------------
# Una respuesta de error nunca expone trazas ni detalle interno.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
