# Maven Wrapper: fija la version de Maven con la que se construye el backend.
# `distributionType=only-script` evita versionar un .jar binario: los scripts
# mvnw y mvnw.cmd descargan Maven la primera vez y lo reutilizan despues.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
