# Cabeceras de seguridad de lo que sirve Nginx: HTML, service worker y estaticos.
# La API no lo incluye porque Spring Security ya envia las suyas; repetirlas
# daria dos valores por cabecera.
#
# Nginx descarta los add_header heredados en cuanto una location declara uno
# propio, asi que cada location que anade cabeceras incluye tambien este archivo.
# La CSP y HSTS quedan fuera a proposito: son decisiones que dependen del
# dominio de R2 y del dominio definitivo, no de este archivo.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
