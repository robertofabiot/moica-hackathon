# Validacion desechable, aislada del Compose de desarrollo y de Railway.
services:
  postgres:
    # PostgreSQL 18 sobre Debian, como la base de produccion en Railway: la
    # variante Alpine usa otra libc y ordena el texto de otra manera.
    image: postgres:18
    environment:
      POSTGRES_DB: ${MOICA_DB_NOMBRE:?}
      POSTGRES_USER: ${MOICA_DB_USUARIO:?}
      POSTGRES_PASSWORD: ${MOICA_DB_CLAVE:?}
    volumes:
      # Desde la 18 la imagen guarda los datos en /var/lib/postgresql/18/docker:
      # el volumen se monta en el directorio padre, no en .../data.
      - datos-smoke:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    image: moica-backend:p11
    build: ./backend
    env_file: .env.example
    environment:
      # El smoke de produccion conserva `prod`; el wrapper E2E lo desactiva para
      # poder servir cookies no Secure sobre HTTP en loopback. Los nombres son
      # propios del wrapper a proposito: `.env.example` los alimentaria por
      # `--env-file` si se llamaran igual que las variables de la aplicacion.
      SPRING_PROFILES_ACTIVE: "${MOICA_SMOKE_PERFIL:-prod}"
      MOICA_DB_HOST: postgres
      MOICA_DB_PORT: 5432
      MOICA_BACKEND_PORT: 8080
      MOICA_COOKIE_SEGURA: "${MOICA_SMOKE_COOKIE_SEGURA:-true}"
      MOICA_SOPORTE_CANAL: demo@example.org
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    image: moica-frontend:p11
    build: ./frontend
    environment:
      PORT: 8080
      MOICA_BACKEND_UPSTREAM: backend:8080
    ports:
      - "127.0.0.1:${MOICA_SMOKE_PORT:-18080}:8080"
    depends_on:
      - backend
volumes:
  datos-smoke:
