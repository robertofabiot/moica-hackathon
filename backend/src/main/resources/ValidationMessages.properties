# Mensajes de Bean Validation en espanol.
#
# Hibernate Validator busca este archivo en la raiz del classpath y sus claves
# sustituyen a los mensajes por omision, que vienen en ingles. Aqui van los
# mensajes genericos de las restricciones estandar; los especificos de una regla
# de Moica se declaran en su propia anotacion, como `@ClaveSegura`.
#
# El archivo se lee como UTF-8, asi que los acentos se escriben tal cual.

jakarta.validation.constraints.NotBlank.message=Este dato es obligatorio.
jakarta.validation.constraints.NotNull.message=Este dato es obligatorio.
jakarta.validation.constraints.NotEmpty.message=Este dato es obligatorio.
jakarta.validation.constraints.Email.message=Escribe un correo electrónico válido.
jakarta.validation.constraints.Size.message=Debe tener como máximo {max} caracteres.
