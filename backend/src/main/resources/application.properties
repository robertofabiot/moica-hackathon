spring.application.name=moica-backend

# El puerto y la conexion salen del entorno. Si las variables no estan definidas
# en el sistema, se importan del archivo `.env` de la raiz del repositorio, que
# no se versiona. Las variables de entorno reales tienen prioridad sobre el
# archivo, de modo que CI y produccion no dependen de el.
spring.config.import=optional:file:../.env[.properties]

server.port=${MOICA_BACKEND_PORT:8080}

# -----------------------------------------------------------------------------
# Base de datos
# -----------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${MOICA_DB_HOST:localhost}:${MOICA_DB_PORT:5432}/${MOICA_DB_NOMBRE}
spring.datasource.username=${MOICA_DB_USUARIO}
spring.datasource.password=${MOICA_DB_CLAVE}

# El esquema lo crean las migraciones versionadas, nunca Hibernate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway aplica al arrancar las migraciones de db/migration y registra cada una
# en `flyway_schema_history`. Es el unico mecanismo autorizado para cambiar el
# esquema, en local, en CI y en produccion.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# -----------------------------------------------------------------------------
# Healthcheck
# -----------------------------------------------------------------------------
# Se expone unicamente `/actuator/health`. El resto de endpoints de Actuator
# permanece cerrado: publicarlos revelaria configuracion y entorno.
management.endpoints.web.exposure.include=health
# La respuesta publica es solo el estado agregado. El detalle por componente
# (por ejemplo, la conexion a la base de datos) influye en ese estado, pero no
# se devuelve: describiria la infraestructura a cualquiera que consulte.
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# -----------------------------------------------------------------------------
# Errores
# -----------------------------------------------------------------------------
# Una respuesta de error nunca expone trazas ni detalle interno.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
