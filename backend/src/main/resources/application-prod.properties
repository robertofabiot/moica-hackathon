# Solo activar con backend privado y Nginx como frontera de entrada.
server.address=::
server.forward-headers-strategy=native
server.tomcat.redirect-context-root=false
# Tomcat procesa X-Forwarded-* solo desde pares de red privada/loopback.
server.tomcat.remoteip.internal-proxies=10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2\\d|3[01])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1|(?i:fd[0-9a-f:]+|fc[0-9a-f:]+)
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.tomcat.remoteip.host-header=x-forwarded-host
server.tomcat.remoteip.port-header=x-forwarded-port
